
name: Project Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display project files
        run: |
          echo "Checking project files..."
          ls -la

      - name: Verify README
        run: |
          test -f README.md
          grep -q "Predictive Motion Tracking IoT" README.md
          echo "README verification passed!"

      - name: Verify GitHub workflow
        run: |
          test -f .github/workflows/main.yml
          echo "Workflow verification passed!"
